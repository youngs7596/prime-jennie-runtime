name: prime-jennie-runtime

x-common-env: &common-env
  TZ: Asia/Seoul
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: pj_runtime
  POSTGRES_PASSWORD: ${PJ_RUNTIME_PASSWORD:-dev_runtime}
  POSTGRES_DB: prime_jennie_v3
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis}

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pj_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev_admin}
      POSTGRES_DB: prime_jennie_v3
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/postgres_data:/var/lib/postgresql/data
      - ./migrations/001_v3_schema.sql:/docker-entrypoint-initdb.d/001_v3_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pj_admin -d prime_jennie_v3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis}
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- KIS Gateway (Track C) ---

  kis-gateway:
    image: ghcr.io/youngs7596/prime-jennie-runtime/kis-gateway:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.kis_gateway
    environment:
      <<: *common-env
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapivts.koreainvestment.com:29443}
      KIS_IS_PAPER: ${KIS_IS_PAPER:-true}
      KIS_TOKEN_FILE_PATH: /app/data/kis_token/v3_kis_token.json
      KIS_STREAMER_MODE: ${KIS_STREAMER_MODE:-websocket}
    volumes:
      # 토큰 캐시 — 장중 재시작 금지 원칙. v2와 경로 분리 (v3_kis_token.json).
      - ${DOCKER_DATA_DIR:-./data}/kis_token:/app/data/kis_token
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Fast Loop Executor (Track C) ---

  fast-loop:
    image: ghcr.io/youngs7596/prime-jennie-runtime/fast-loop:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.fast_loop
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # --- Slow Loop (Track B, Phase 2.9 scout/macro 주기 runner) ---
  #
  # scheduled_jobs(owner=slow_loop) 에서 cron 을 읽어 run_slow_loop() 호출.
  # v2 scout_job DAG 대체. vLLM (Qwen3) 은 v2 재활용.

  slow-loop:
    image: ghcr.io/youngs7596/prime-jennie-runtime/slow-loop:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.slow_loop
    environment:
      <<: *common-env
      VLLM_LLM_URL: ${VLLM_LLM_URL:-http://vllm-llm:8001/v1}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-jart25/Qwen3-30B-A3B-Instruct-2507-Autoround-Int-4bit-gptq}
      # Primary = DeepSeek chat (Scout + Macro). Shadow = Claude Opus 4.7 (회귀 검증).
      # 2026-04-22 swap — Opus 비용 부담으로 primary 복귀, Opus 는 1~2주 회귀 데이터용.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Macro/Scout shadow 병렬 평가 — 2026-04-22 종료 (4일치 35 successful run 으로
      # DeepSeek Gate 100%/Size 86% 일치 확인됨). 모델 비교 재실행 필요 시 1 로.
      MACRO_SHADOW_ENABLED: ${MACRO_SHADOW_ENABLED:-0}
      SCOUT_SHADOW_ENABLED: ${SCOUT_SHADOW_ENABLED:-0}
      # screening-executor docker sandbox seccomp profile.
      # 배포 호스트 기준 절대경로 (docker-in-docker: 호스트 데몬이 읽는다).
      # 예: SCREENING_SECCOMP_PROFILE=/opt/prime-jennie-runtime/infra/screening/seccomp.json
      # 빈 값이면 adapter 가 --security-opt=seccomp 옵션 생략 (Docker default seccomp 적용).
      SCREENING_SECCOMP_PROFILE: ${SCREENING_SECCOMP_PROFILE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Price Scheduler (Track C, Phase 2.9 KIS 분봉/일봉 적재 runner) ---
  #
  # v2 collect_minute_chart / daily_market_data_collector DAG 대체. KIS Gateway
  # REST endpoint 를 쳐서 minute_prices / daily_prices 에 upsert.

  price-scheduler:
    image: ghcr.io/youngs7596/prime-jennie-runtime/price-scheduler:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.price_scheduler
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # --- vLLM (로컬 LLM 서버 — Qwen3 30B-A3B MoE INT4) ---
  #
  # 2026-04-21 v2 → v3 로 이관 (v2 전면 퇴역). news-pipeline 의 EventExtractor 가
  # 소비. slow-loop 도 env 로 연결되지만 실제 호출은 DeepSeek/Opus API 라 무관.
  # RTX 3090 (Ampere sm_86) 호환성 이슈로 vLLM 0.16.0-cu130 유지 — 0.19.1-cu130 은
  # fill_/attention 기본 커널 누락으로 crash. gpu 프로필 — GPU 없는 dev 환경은
  # --profile full 만 up 하면 자동 스킵.
  vllm-llm:
    image: vllm/vllm-openai:v0.16.0-cu130
    profiles: ["gpu"]
    ipc: host
    environment:
      # 첫 기동 시 모델 다운로드 필요 — offline=0. 캐시되면 "1" 로.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      LD_LIBRARY_PATH: "/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:/usr/local/nvidia/lib"
    command: >
      jart25/Qwen3-30B-A3B-Instruct-2507-Autoround-Int-4bit-gptq
      --port 8001
      --gpu-memory-utilization 0.88
      --max-model-len 8192
      --quantization gptq_marlin
      --dtype half
      --kv-cache-dtype fp8_e4m3
      --max-num-seqs 64
      --enable-prefix-caching
      --trust-remote-code
      --enforce-eager
    volumes:
      - ${DOCKER_DATA_DIR:-/docker_data}/huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models')\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    ports:
      - "127.0.0.1:8001:8001"

  # --- News Pipeline (Track E) ---
  #
  # long-running runner. collector 주기 크롤 → Redis Stream → extractor (EXAONE/
  # Qwen3 기반 메타데이터 추출) → news_events 테이블.

  news-pipeline:
    image: ghcr.io/youngs7596/prime-jennie-runtime/news-pipeline:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.news_pipeline
    environment:
      <<: *common-env
      VLLM_LLM_URL: ${VLLM_LLM_URL:-http://vllm-llm:8001/v1}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-jart25/Qwen3-30B-A3B-Instruct-2507-Autoround-Int-4bit-gptq}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Telegram Bot (Track C, Phase 1 단방향 발신) ---

  telegram-bot:
    image: ghcr.io/youngs7596/prime-jennie-runtime/telegram-bot:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.telegram_bot
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-false}
      KIS_GATEWAY_URL: http://kis-gateway:8080
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Screening Executor (Track D) ---
  #
  # 컴포즈 서비스로 띄우지 않고 이미지만 빌드한다. 실제 실행은 ScreeningToolAdapter
  # (호스트 측)가 매번 `docker run --rm -i ...`로 spawn하는 ephemeral 컨테이너.
  # 그래서 entrypoint는 stdin → stdout JSON 프로토콜이고, profiles로 일반 up에서 제외.
  #
  # 빌드만: `docker compose --profile build-only build screening-executor`

  screening-executor:
    image: ghcr.io/youngs7596/prime-jennie-runtime/screening-executor:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.screening
    profiles: ["build-only"]
    # 아래 설정은 직접 `docker run` 시 ScreeningToolAdapter._build_argv가 부여한다.
    # compose에는 참고용으로만 남김.
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:size=256M
    mem_limit: 4g
    cpus: 2
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      - screening-isolated

  # --- Observability (Track E, Phase 2.10 #11) ---
  #
  # v2 `prime-jennie/infra/{loki,promtail,grafana}` 원형 포팅. v3 bridge 네트워크로
  # 전환했으므로 서비스명 기반 주소 사용 (promtail → loki:3100, grafana → loki:3100).
  # profile "observe" 로 분리 — 무거운 설치 없이 코어만 띄우고 싶을 때 제외 가능.

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: "3300"
    ports:
      - "3300:3300"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  # --- Cloudflare Tunnel (Track E, Phase 2.10 #11) ---
  #
  # MS-01 외부 노출 경로. CLOUDFLARE_TUNNEL_TOKEN 으로 제어.
  # profile "tunnel" — 운영서버에서만 기동.

  cloudflared:
    image: cloudflare/cloudflared:latest
    # `--metrics :2000` 로 Prometheus metrics + /ready 를 호스트 네트워크로 노출.
    # Phase 2.13-6: 기존에 metrics 플래그가 없어 smoke probe 가 항상 연결 실패했다.
    # 포트 2000 을 127.0.0.1 바인드로만 노출 (외부 노출은 불필요).
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    ports:
      - "127.0.0.1:2000:2000"
    restart: unless-stopped
    profiles: ["tunnel", "full"]

  # --- Control UI (Phase 2.10 Track F — Nginx 서빙, 별 repo: prime-jennie-control-ui) ---

  control-ui:
    image: prime-jennie-control-ui:latest
    # 별 repo (prime-jennie-control-ui) 에서 로컬 빌드된 이미지. registry 에 없으므로
    # `docker compose pull` 이 건너뛰도록 pull_policy=never. control-ui 도 ghcr 로
    # 옮기면 제거 가능 (TODO).
    pull_policy: never
    ports:
      - "80:80"
    depends_on:
      dashboard:
        condition: service_started
    restart: unless-stopped
    profiles: ["full", "apps"]

  # --- Dashboard (Track C, Phase 2.10 #4) ---
  #
  # FastAPI 백엔드 8090. CORS allowlist 는 DASHBOARD_CORS_ORIGINS 로 주입.
  # control-ui (별 repo) 와 airflow/llm_stats/logs/macro/portfolio/system/trades/watchlist
  # 9개 router 소비.

  dashboard:
    image: ghcr.io/youngs7596/prime-jennie-runtime/dashboard:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    environment:
      <<: *common-env
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # /api/system/health 의 daemon container state 조회 (read-only docker socket)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full", "apps"]

  # --- Monitor (Track C, Phase 2.10 #5) ---
  #
  # poller 기반 포지션/체결 모니터 8091. KIS Gateway REST 로 price/balance 폴링.

  monitor:
    image: ghcr.io/youngs7596/prime-jennie-runtime/monitor:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.monitor
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
      MONITOR_POLL_INTERVAL_SEC: ${MONITOR_POLL_INTERVAL_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    # monitor 는 KIS Gateway 의존이므로 full 전용. apps 프로파일에는 포함하지 않는다.
    profiles: ["full"]

  # --- Job Worker (Track B, Phase 2.10 #1 — v2 job-worker 22 엔드포인트 대체) ---
  #
  # v2 `prime_jennie/services/jobs/app.py` (FastAPI, 2883줄) 는 Airflow DAG 가 http_conn
  # 으로 불러 돌리던 함수 shell 이었다. v3 는 `scheduled_jobs` 테이블 (owner=job_worker)
  # 을 단일 진실 공급원으로 삼고 apscheduler 로 직접 실행 → daemon 1개로 압축.
  #
  # HTTP 미노출 (health 포함) — slow-loop/news-pipeline 패턴과 일치. 외부 모니터링은
  # dashboard `/api/airflow/jobs` 프록시 또는 `scheduled_job_runs` 테이블로.
  # cleanup/macro/contract_smoke 등은 `scripts/seed_scheduled_jobs.py` 에서 시드.

  job-worker:
    image: ghcr.io/youngs7596/prime-jennie-runtime/job-worker:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.job_worker
    environment:
      <<: *common-env
      # daily_asset_snapshot · refresh_market_caps · collect_minute_chart 등
      # KIS 의존 잡이 호출. 누락되면 cfg default `http://localhost:8080` 으로
      # 떨어져 ConnectError 가 매일 cron 시점에 재현된다 (04-20~30 9회 재현).
      KIS_GATEWAY_URL: http://kis-gateway:8080
      # macro_collect_global/korea 는 BOK ECOS 키가 있을 때만 실제 호출.
      # 비어 있으면 jobs/app.py 가 None 으로 전달 → fallback 경로만 동작.
      BOK_ECOS_API_KEY: ${BOK_ECOS_API_KEY:-}
      DART_API_KEY: ${DART_API_KEY:-}
      # DeepSeek chat: global_news_digest 요약 + daily_briefing_report + wsj_gmail_ingest 요약.
      # 2026-04-24 briefing/WSJ 도 Opus → DeepSeek 전환 (월 ~$30-50 추가 절감).
      # 키 누락 시 briefing 은 fallback HTML, WSJ 요약은 skip.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      MACRO_DIGEST_SUMMARIZER_MODEL: ${MACRO_DIGEST_SUMMARIZER_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-false}
      # wsj_gmail_ingest 용 OAuth credentials/token. 파일 없으면 job 자체가 skip.
      WSJ_GMAIL_CREDENTIALS_PATH: /app/infra/secrets/gmail/credentials.json
      WSJ_GMAIL_TOKEN_PATH: /app/infra/secrets/gmail/token.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # token.json 은 refresh 시 재작성 필요 → rw. credentials 도 같이 마운트.
      - ./infra/secrets/gmail:/app/infra/secrets/gmail
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Application Services (Phase 2.10 library 정리) ---
  #
  # Track D 설계 확정 (2026-04-17):
  #   briefing (#6)  — pure async library. job worker 이미지에 import 됨 → 단독 서비스 없음
  #   backtest (#8)  — library. Phase 3 engine/daily_strategies 포팅 후 CLI 추가 예정
  #   council  (#7)  — pure library. slow_loop Macro + dashboard macro router + telegram_bot import → 단독 서비스 없음

volumes:
  grafana_data:
  loki_data:

networks:
  default:
    driver: bridge
  screening-isolated:
    driver: bridge
    internal: true
