# Grafana datasource — v2 `prime-jennie/infra/grafana/provisioning/...` 포팅.
# v3 변경: url 을 서비스명 기반(loki:3100) 으로 교체 (bridge 네트워크).

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    # uid 명시 — dashboards/*.json 의 datasource.uid 와 매칭. 미지정 시 grafana 가
    # 무작위 uid 를 만들어 provisioned dashboard 의 패널이 datasource 를 못 찾는다.
    uid: loki
