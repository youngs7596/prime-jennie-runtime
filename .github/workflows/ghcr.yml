name: GHCR Publish

# push 시 Docker 이미지 10개를 GitHub Actions 러너에서 빌드해 ghcr.io 에 push.
# MS-01 self-hosted runner 는 이후 deploy.yml 에서 `docker compose pull + up -d` 만
# 수행 → MS-01 CPU/팬 부하 제거. v2 ghcr.yml 패턴 포팅.
#
# 캐시: type=gha (GitHub Actions cache) 로 layer 재사용.
# 태그: main 브랜치는 `latest` + `sha-<shortsha>`. PR 은 빌드 skip.

on:
  push:
    branches: [main]
    paths:
      - 'prime_jennie_runtime/**'
      - 'infra/docker/**'
      - 'pyproject.toml'
      - 'docker-compose.yml'
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/ghcr.yml'
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kis-gateway
            dockerfile: infra/docker/Dockerfile.kis_gateway
          - service: fast-loop
            dockerfile: infra/docker/Dockerfile.fast_loop
          - service: slow-loop
            dockerfile: infra/docker/Dockerfile.slow_loop
          - service: price-scheduler
            dockerfile: infra/docker/Dockerfile.price_scheduler
          - service: news-pipeline
            dockerfile: infra/docker/Dockerfile.news_pipeline
          - service: telegram-bot
            dockerfile: infra/docker/Dockerfile.telegram_bot
          - service: screening-executor
            dockerfile: infra/docker/Dockerfile.screening
          - service: dashboard
            dockerfile: infra/docker/Dockerfile.dashboard
          - service: monitor
            dockerfile: infra/docker/Dockerfile.monitor
          - service: job-worker
            dockerfile: infra/docker/Dockerfile.job_worker
          - service: coordinator-listener
            dockerfile: infra/docker/Dockerfile.coordinator_listener
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
