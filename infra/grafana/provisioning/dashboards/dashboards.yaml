# Grafana provisioning — dashboard provider config.
#
# Loads JSON dashboards from /etc/grafana/provisioning/dashboards (bind-mounted
# from infra/grafana/provisioning/dashboards). docker-compose 의 grafana 서비스
# 가 provisioning 디렉토리 전체를 read-only 로 마운트하므로 별도 마운트 불필요.

apiVersion: 1

providers:
  - name: "prime-jennie"
    orgId: 1
    folder: "Prime Jennie"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
