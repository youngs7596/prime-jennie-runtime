# Promtail config — v2 `prime-jennie/infra/promtail/promtail-config.yaml` 에서 포팅.
# v3 변경: clients.url 을 host.docker.internal → 서비스명(loki) 으로 교체
# (v3 compose 는 bridge 네트워크. v2 는 network_mode: host 였음).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # v2 잔존 공유 컨테이너(vllm/qdrant)는 제외. 그들 로그 파일에는 3월 말부터 누적된
      # old timestamp 가 있어 Loki reject_old_samples 에 걸려 400 을 뱉으면 같은 batch 의
      # v3 신규 로그까지 전량 drop 되어 promtail 이 멈춘다 (2026-04-18 장애).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        action: keep
        regex: 'prime-jennie-runtime'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_app']
        target_label: 'app'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - docker: {}
