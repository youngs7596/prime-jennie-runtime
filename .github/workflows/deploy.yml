name: Deploy

# MS-01 self-hosted runner 에서 `docker compose pull + up -d` 만 수행.
# 실제 이미지 빌드는 ghcr.yml 이 GitHub-hosted runner 에서 처리 → MS-01 CPU/팬
# 부하 제거. 빌드 완료 후 이미지 태그 `latest` 가 ghcr 에 도착해야 pull 성공.
#
# ghcr 빌드가 먼저 끝나야 의미 있으므로 이 워크플로우는 ghcr.yml 완료 후 체인.

on:
  workflow_run:
    workflows: ["GHCR Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull latest code
        working-directory: /home/youngs75/projects/prime-jennie-runtime
        run: |
          set -euo pipefail
          echo "==> Fetching origin"
          git fetch --quiet origin main
          LOCAL_BEFORE=$(git rev-parse HEAD)
          echo "Before: $(git log --oneline -1)"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "==> Stashing local changes"
            git stash push -u -m "ci-auto-stash-${GITHUB_RUN_ID}"
          fi

          git pull --ff-only origin main
          echo "After:  $(git log --oneline -1)"

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images and deploy
        working-directory: /home/youngs75/projects/prime-jennie-runtime
        env:
          COMPOSE_PROJECT_NAME: prime-jennie-runtime
        run: |
          set -euo pipefail
          echo "==> Pulling images from ghcr.io"
          docker compose --profile full pull

          echo "==> docker compose up -d (no build)"
          docker compose --profile full up -d --no-build

          echo "==> Pruning dangling images"
          docker image prune -f || true

          echo ""
          echo "=== Deploy complete ==="
          docker compose --profile full ps
