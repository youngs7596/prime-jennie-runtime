name: prime-jennie-runtime

x-common-env: &common-env
  TZ: Asia/Seoul
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: pj_runtime
  POSTGRES_PASSWORD: ${PJ_RUNTIME_PASSWORD:-dev_runtime}
  POSTGRES_DB: prime_jennie_v3
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis}

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pj_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-dev_admin}
      POSTGRES_DB: prime_jennie_v3
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/postgres_data:/var/lib/postgresql/data
      - ./migrations/001_v3_schema.sql:/docker-entrypoint-initdb.d/001_v3_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pj_admin -d prime_jennie_v3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis}
    volumes:
      - ${DOCKER_DATA_DIR:-./data}/redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- KIS Gateway (Track C) ---

  kis-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.kis_gateway
    environment:
      <<: *common-env
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_BASE_URL: ${KIS_BASE_URL:-https://openapivts.koreainvestment.com:29443}
      KIS_IS_PAPER: ${KIS_IS_PAPER:-true}
      KIS_TOKEN_FILE_PATH: /app/data/kis_token/v3_kis_token.json
      KIS_STREAMER_MODE: ${KIS_STREAMER_MODE:-websocket}
    volumes:
      # 토큰 캐시 — 장중 재시작 금지 원칙. v2와 경로 분리 (v3_kis_token.json).
      - ${DOCKER_DATA_DIR:-./data}/kis_token:/app/data/kis_token
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Fast Loop Executor (Track C) ---

  fast-loop:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.fast_loop
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # --- Slow Loop (Track B, Phase 2.9 scout/macro 주기 runner) ---
  #
  # scheduled_jobs(owner=slow_loop) 에서 cron 을 읽어 run_slow_loop() 호출.
  # v2 scout_job DAG 대체. vLLM EXAONE 은 v2 재활용.

  slow-loop:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.slow_loop
    environment:
      <<: *common-env
      VLLM_LLM_URL: ${VLLM_LLM_URL:-http://host.docker.internal:8001/v1}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_SHADOW_MODEL: ${DEEPSEEK_SHADOW_MODEL:-deepseek-reasoner}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Price Scheduler (Track C, Phase 2.9 KIS 분봉/일봉 적재 runner) ---
  #
  # v2 collect_minute_chart / daily_market_data_collector DAG 대체. KIS Gateway
  # REST endpoint 를 쳐서 minute_prices / daily_prices 에 upsert.

  price-scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.price_scheduler
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # --- News Pipeline (Track E, Phase 2.9 데이터 수집 runner) ---
  #
  # apscheduler 기반 long-running runner. scheduled_jobs 테이블(owner=news_pipeline)
  # 에서 cron 을 읽어 네이버 크롤 → EXAONE 감성 → kure 임베딩 → Postgres/Qdrant 적재.
  # 외부 의존 (vLLM, Qdrant) 은 v2 재활용 — host 에서 접근 가능한 주소로 주입.

  news-pipeline:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.news_pipeline
    environment:
      <<: *common-env
      VLLM_LLM_URL: ${VLLM_LLM_URL:-http://host.docker.internal:8001/v1}
      VLLM_LLM_MODEL: ${VLLM_LLM_MODEL:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      VLLM_EMBED_URL: ${VLLM_EMBED_URL:-http://host.docker.internal:8002/v1}
      VLLM_EMBED_MODEL: ${VLLM_EMBED_MODEL:-kure-v1}
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      QDRANT_COLLECTION_V3: ${QDRANT_COLLECTION_V3:-v3_news_sentiments}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      # v2 가 host 네트워크로 올라가 있는 Qdrant/vLLM 에 접근 (Linux 호환).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Telegram Bot (Track C, Phase 1 단방향 발신) ---

  telegram-bot:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.telegram_bot
    environment:
      <<: *common-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Screening Executor (Track D) ---
  #
  # 컴포즈 서비스로 띄우지 않고 이미지만 빌드한다. 실제 실행은 ScreeningToolAdapter
  # (호스트 측)가 매번 `docker run --rm -i ...`로 spawn하는 ephemeral 컨테이너.
  # 그래서 entrypoint는 stdin → stdout JSON 프로토콜이고, profiles로 일반 up에서 제외.
  #
  # 빌드만: `docker compose --profile build-only build screening-executor`

  screening-executor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.screening
    image: screening-executor:latest
    profiles: ["build-only"]
    # 아래 설정은 직접 `docker run` 시 ScreeningToolAdapter._build_argv가 부여한다.
    # compose에는 참고용으로만 남김.
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:size=256M
    mem_limit: 4g
    cpus: 2
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      - screening-isolated

  # --- Observability (Track E, Phase 2.10 #11) ---
  #
  # v2 `prime-jennie/infra/{loki,promtail,grafana}` 원형 포팅. v3 bridge 네트워크로
  # 전환했으므로 서비스명 기반 주소 사용 (promtail → loki:3100, grafana → loki:3100).
  # profile "observe" 로 분리 — 무거운 설치 없이 코어만 띄우고 싶을 때 제외 가능.

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: "3300"
    ports:
      - "3300:3300"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles: ["observe", "full"]

  # --- Cloudflare Tunnel (Track E, Phase 2.10 #11) ---
  #
  # MS-01 외부 노출 경로. CLOUDFLARE_TUNNEL_TOKEN 으로 제어.
  # profile "tunnel" — 운영서버에서만 기동.

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel", "full"]

  # --- Control UI (Phase 2.10 Track F — Nginx 서빙, 별 repo: prime-jennie-control-ui) ---

  control-ui:
    image: prime-jennie-control-ui:latest
    ports:
      - "80:80"
    depends_on:
      dashboard:
        condition: service_started
    restart: unless-stopped
    profiles: ["full", "apps"]

  # --- Dashboard (Track C, Phase 2.10 #4) ---
  #
  # FastAPI 백엔드 8090. CORS allowlist 는 DASHBOARD_CORS_ORIGINS 로 주입.
  # control-ui (별 repo) 와 airflow/llm_stats/logs/macro/portfolio/system/trades/watchlist
  # 9개 router 소비.

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    environment:
      <<: *common-env
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # /api/system/health 의 daemon container state 조회 (read-only docker socket)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full", "apps"]

  # --- Monitor (Track C, Phase 2.10 #5) ---
  #
  # poller 기반 포지션/체결 모니터 8091. KIS Gateway REST 로 price/balance 폴링.

  monitor:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.monitor
    environment:
      <<: *common-env
      KIS_GATEWAY_URL: http://kis-gateway:8080
      MONITOR_POLL_INTERVAL_SEC: ${MONITOR_POLL_INTERVAL_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kis-gateway:
        condition: service_started
    restart: unless-stopped
    # monitor 는 KIS Gateway 의존이므로 full 전용. apps 프로파일에는 포함하지 않는다.
    profiles: ["full"]

  # --- Job Worker (Track B, Phase 2.10 #1 — v2 job-worker 22 엔드포인트 대체) ---
  #
  # v2 `prime_jennie/services/jobs/app.py` (FastAPI, 2883줄) 는 Airflow DAG 가 http_conn
  # 으로 불러 돌리던 함수 shell 이었다. v3 는 `scheduled_jobs` 테이블 (owner=job_worker)
  # 을 단일 진실 공급원으로 삼고 apscheduler 로 직접 실행 → daemon 1개로 압축.
  #
  # HTTP 미노출 (health 포함) — slow-loop/news-pipeline 패턴과 일치. 외부 모니터링은
  # dashboard `/api/airflow/jobs` 프록시 또는 `scheduled_job_runs` 테이블로.
  # cleanup/macro/contract_smoke 등은 `scripts/seed_scheduled_jobs.py` 에서 시드.

  job-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.job_worker
    environment:
      <<: *common-env
      # macro_collect_global/korea 는 BOK ECOS 키가 있을 때만 실제 호출.
      # 비어 있으면 jobs/app.py 가 None 으로 전달 → fallback 경로만 동작.
      BOK_ECOS_API_KEY: ${BOK_ECOS_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # --- Application Services (Phase 2.10 library 정리) ---
  #
  # Track D 설계 확정 (2026-04-17):
  #   briefing (#6)  — pure async library. job worker 이미지에 import 됨 → 단독 서비스 없음
  #   backtest (#8)  — library. Phase 3 engine/daily_strategies 포팅 후 CLI 추가 예정
  #   council  (#7)  — pure library. slow_loop Macro + dashboard macro router + telegram_bot import → 단독 서비스 없음

volumes:
  grafana_data:
  loki_data:

networks:
  default:
    driver: bridge
  screening-isolated:
    driver: bridge
    internal: true
