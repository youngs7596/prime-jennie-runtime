# Promtail config — v2 `prime-jennie/infra/promtail/promtail-config.yaml` 에서 포팅.
# v3 변경: clients.url 을 host.docker.internal → 서비스명(loki) 으로 교체
# (v3 compose 는 bridge 네트워크. v2 는 network_mode: host 였음).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # v2 잔존 컨테이너(prime-jennie 프로젝트)는 Docker SD 단에서 필터링.
        # relabel `keep` 만 쓰면 promtail 3.3.2 에서 v2 컨테이너가 계속 tail 되어
        # label 없는 stream 이 Loki 로 push → 400 "at least one label pair required"
        # → drop_entries 초당 46 건 발생 (2026-04-18 22:xx 재진단).
        filters:
          - name: label
            values: ['com.docker.compose.project=prime-jennie-runtime']
    relabel_configs:
      # belt-and-suspenders: docker filter 가 우회된 타깃이 생겨도 relabel 에서 다시 차단.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        action: keep
        regex: '^prime-jennie-runtime$'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_app']
        target_label: 'app'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - docker: {}
