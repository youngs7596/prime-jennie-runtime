# Strategy Policy v3.0.4 — strategy_tag별 base_pct, exit rules, entry conditions.
# Strategy Engine이 ScreeningCandidate를 PositionSheet로 조립할 때 참고.
# base_pct, max_notional_krw, max_notional_pct, exit rule, entry condition 파라미터
# 모두 영석이 수동 관리.
#
# 2026-05-11: max_notional_pct (자산비례 cap) 도입 — v2 sizing 동등 (12%).
# fast_loop BalanceAwareSizer 가 min(total_asset × pct, max_notional_krw, cash) 적용.
# max_notional_krw 는 절대 안전 한도 (자산 폭증 시 cap, 평소 발동 X).
#
# 2026-05-11 (v3.0.4): 두 갈래 강화 결합.
# (A) v2 scanner 진입 시그널 일부 포팅 — fast_loop BarEngine + IndicatorProvider
#     가 1분봉 누적/ma20/RSI/recent_high 제공. 신규 EntryCondition 3종 추가
#     (volume_over_ma20 / rsi_under / price_above_recent_high). 보수 도입:
#      - rsi_under threshold = 75: v2 risk_gates.check_rsi_guard bull max 와 동일.
#      - volume_over_ma20 는 yaml 미부착 — 분봉 단위 ratio 의미가 v2 일봉 단위와
#        달라 임계값을 운영 데이터로 정한 뒤 단계적 도입.
#      - GAP_UP_REBOUND 만 price_above_recent_high (lookback=5) 부착 (breakout).
#     Warm-up (분봉 history 부족) 동안 신규 condition 은 자동 보류 → 시초 9:00~
#     9:05 진입 보수 측 fall. 운영 데이터 누적 후 dynamic threshold 조정.
# (B) overextension_exit 정책 배치 — 코드 (_check_overextension) 는 이미 1분봉
#     RSI 임계 청산 구현됨. 단기 모멘텀 전략 (GAP_UP_REBOUND, EARNINGS_DRIFT) 의
#     최우선 청산 룰로 부착. rsi_threshold=80 보수적 (70~75 false trigger 빈도
#     우려, v2 운영 데이터에서 80 도달 시 평균 reversal 확률 높음). 운영 후 70 검토.
#
# 참고:
# - v2 실증: Breakeven +3%→+0.3%, Profit Floor +15%→+10%, Death Cross MA5/MA20 min_loss 1%
#   v2 position sizing: MAX_POSITION_PCT_DEFAULT 12%, A+ 18%
# - POSITION_SHEET_SPEC §4.2 / §5.3 권장 순서대로 rule 배열 (overextension_exit 이
#   가장 앞 — first_match 평가에서 단기 과열 신호를 가장 빨리 잡기 위함)
# - fixed_sl, time_stop은 모든 정책에 반드시 포함
# - default_entry_conditions: scout entry_hint 의 conditions_hint 가 비어있을 때 보강.

policy_version: "v3.0.4"

strategies:
  GAP_UP_REBOUND:
    base_pct: 0.05
    max_notional_pct: 0.12
    max_notional_krw: 50000000
    default_entry_conditions:
      - type: spread_under_bps
        max_bps: 20
      # v2 scanner detect_gap_up_rebound 의 마지막 조건 (현재가 ≥ 시가)
      # 의 v3 표현 — 직전 5분봉 고점 돌파 = breakout confirmation.
      # 9:00~9:05 warm-up 동안은 no_data 사유로 보류 (시초 noise 회피 동작).
      - type: price_above_recent_high
        lookback: 5
      # v2 risk_gates.check_rsi_guard 의 bull regime threshold 75 와 동일.
      # 75+ 즉시 진입 차단 (overextension filter). warm-up = 보류.
      - type: rsi_under
        threshold: 75
    default_exit_rules:
      # overextension_exit: 1분봉 RSI 80 초과 시 즉시 청산 (당일 갭상승 후 단기
      # 과열 컷). first_match 평가에서 가장 앞에 배치 — engine.py 의 _EXIT_RULE_ORDER
      # 가 자동 정렬하지만 YAML 도 인텐트 명확히 하기 위해 앞에 둠.
      - type: overextension_exit
        rsi_threshold: 80
      - type: trailing_tp
        activate_pct: 0.05
        drop_pct: 0.03
      - type: breakeven
        activate_pct: 0.03
        floor_pct: 0.003
      - type: fixed_sl
        pct: 0.04
      - type: time_stop
        mode: eod

  SECTOR_MOMENTUM:
    base_pct: 0.05
    max_notional_pct: 0.12
    max_notional_krw: 50000000
    default_entry_conditions:
      - type: spread_under_bps
        max_bps: 20
      # 모멘텀 추격 매수 방지 — RSI 과열 종목 진입 차단.
      # v2 detect_momentum max_gain_pct 7% 와 같은 취지 (RSI 로 근사).
      - type: rsi_under
        threshold: 75
    default_exit_rules:
      - type: profit_floor
        activate_pct: 0.15
        floor_pct: 0.10
      - type: trailing_tp
        activate_pct: 0.06
        drop_pct: 0.03
      - type: breakeven
        activate_pct: 0.03
        floor_pct: 0.003
      - type: death_cross
        ma_short: 5
        ma_long: 20
        min_loss_pct: 0.01
      - type: fixed_sl
        pct: 0.05
      - type: time_stop
        mode: hold_days
        value: 5

  EARNINGS_DRIFT:
    # 2026-05-08: base_pct 0.03 → 0.05, max_notional 3M → 5M 으로 GAP_UP_REBOUND/
    # SECTOR_MOMENTUM 과 동일 사이즈로 상향.
    # 2026-05-11: max_notional_pct 0.12 (v2 동등). max_notional_krw 50M 안전 한도.
    base_pct: 0.05
    max_notional_pct: 0.12
    max_notional_krw: 50000000
    default_entry_conditions:
      - type: spread_under_bps
        max_bps: 15
      # earnings drift 는 며칠~수주 hold 인 swing — 단기 RSI 과열만 회피.
      # threshold 80 으로 GAP_UP/SECTOR 보다 관대 (장기 momentum 허용).
      - type: rsi_under
        threshold: 80
    default_exit_rules:
      # overextension_exit: 어닝 후 단기 모멘텀 과열 컷 (RSI 80 초과).
      # GAP_UP_REBOUND 와 동일 임계 — 보수 시작 후 운영 데이터로 조정.
      - type: overextension_exit
        rsi_threshold: 80
      - type: trailing_tp
        activate_pct: 0.07
        drop_pct: 0.04
      - type: fixed_sl
        pct: 0.05
      - type: time_stop
        mode: hold_days
        value: 10

  MEAN_REVERT_RSI:
    base_pct: 0.03
    max_notional_pct: 0.08
    max_notional_krw: 30000000
    default_entry_conditions:
      - type: spread_under_bps
        max_bps: 15
    default_exit_rules:
      - type: fixed_tp
        pct: 0.04
      - type: fixed_sl
        pct: 0.03
      - type: time_stop
        mode: hold_days
        value: 3
