[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prime_jennie_runtime*"]

[project]
name = "prime-jennie-runtime"
version = "0.1.0"
description = "Execution engine for the Prime Jennie self-evolving trading system"
requires-python = ">=3.12"
authors = [
    { name = "youngs75", email = "youngs75.kim@gmail.com" },
]
dependencies = [
    # Harness
    "minyoung-mah>=0.1.0",
    # Core
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "structlog>=24.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    # Redis
    "redis>=5.0,<6",
    # HTTP
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    # LLM
    "litellm>=1.40",
    "langfuse>=2.0",
]

[project.optional-dependencies]
screening = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
]
news = [
    "beautifulsoup4>=4.12",
    "qdrant-client>=1.9",
]
telegram = [
    "python-telegram-bot>=21.0",
]
kis = [
    "pybreaker>=1.0",
    "slowapi>=0.1.9",
    "websocket-client>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "fakeredis>=2.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (DB, Redis required)",
    "e2e: End-to-end tests (all services required)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "SIM105", "UP046"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
