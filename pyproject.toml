[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prime_jennie_runtime*"]

[project]
name = "prime-jennie-runtime"
version = "0.1.0"
description = "Execution engine for the Prime Jennie self-evolving trading system"
requires-python = ">=3.12"
authors = [
    { name = "youngs75", email = "youngs75.kim@gmail.com" },
]
dependencies = [
    # Harness
    "minyoung-mah>=0.1.0",
    # Core
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "structlog>=24.0",
    "pyyaml>=6.0,<7",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    # Redis
    "redis>=5.0,<6",
    # Scheduler (apscheduler — Phase 2.9 데이터 수집 runner 공용)
    "apscheduler>=3.10,<4",
    # HTTP
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    # LLM
    "litellm>=1.40",
    "langfuse>=2.0",
]

[project.optional-dependencies]
screening = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2",
    "scipy>=1.13,<2",  # pandas spearman 상관 (weekly_factor_analysis IC).
]
news = [
    "beautifulsoup4>=4.12",
    "qdrant-client>=1.9",
    "feedparser>=6.0",  # WSJ/Bloomberg/Reuters RSS (Phase 2.13-1)
]
telegram = [
    "python-telegram-bot>=21.0",
]
dashboard = [
    "docker>=7.1",  # /api/system/health 의 daemon container state 조회
]
kis = [
    "pybreaker>=1.0",
    "slowapi>=0.1.9",
    "websockets>=13.0",
]
slow_loop = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
    "fakeredis>=2.21",
    "respx>=0.21",  # httpx mock for KIS Gateway tests
    "freezegun>=1.5",  # time-based tests (time_stop, risk throttle recovery)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (DB, Redis required)",
    "e2e: End-to-end tests (all services required)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "SIM105", "UP046"]

[tool.ruff.lint.per-file-ignores]
# 한국어 LLM 프롬프트 문자열은 줄바꿈 시 의미가 깨짐 (한글 자모 너비도 영문과 다름).
# 프롬프트 모듈만 E501 line-too-long 예외.
"**/prompts.py" = ["E501"]
"**/post_processor.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
